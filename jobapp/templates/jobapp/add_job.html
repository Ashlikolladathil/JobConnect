{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Job - JobConnect</title>
    <link rel="stylesheet" href="{% static 'jobapp/style.css' %}">
</head>
<body>

    <h1>Add a New Job</h1>

    <div class="job-card">
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="job-button">
                Save Job
            </button>
        </form>

        <br>

        <a href="/">Back to Home</a>
    </div>

</body>
</html>
